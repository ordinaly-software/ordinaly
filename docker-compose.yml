# Entorno de desarrollo local. No pensado para producción: el backend usa
# `runserver` en vez de gunicorn, credenciales de BD en claro (solo válidas
# en esta red interna de Docker) y hot reload vía bind mounts.
#
# Los secretos de integraciones (Stripe, Google...) se leen de
# backend/.env (montado en /app/.env); las variables de abajo tienen
# prioridad sobre las de ese fichero.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ordinaly
      POSTGRES_PASSWORD: ordinaly
      POSTGRES_DB: ordinaly_db
    ports:
      # 5433 en el host para no chocar con un PostgreSQL local en el 5432
      # (dentro de Docker sigue siendo el 5432).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordinaly -d ordinaly_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: &backend-build
      context: ./backend
      dockerfile: Dockerfile.dev
    # El frontend comparte esta red (ver `frontend.network_mode`), así que los
    # puertos de ambos se publican aquí.
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      - ./backend:/app
    environment: &backend-env
      DEBUG: "True"
      DJANGO_SECRET_KEY: django-insecure-docker-compose-dev-only
      DATABASE_URL: postgresql://ordinaly:ordinaly@db:5432/ordinaly_db
      TIME_ZONE: Europe/Madrid
      FRONTEND_BASE_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  # Equivalente al cron de producción: encola los avisos programados de los
  # cursos (empieza pronto, recordatorio 24h) y envía los pendientes
  # (nueva formación) cada minuto. Sin él esos correos no salen en local.
  notifications:
    build: *backend-build
    entrypoint: ["sh", "-c"]
    command:
      - while true; do python manage.py run_email_notification_queue; sleep 60; done
    volumes:
      - ./backend:/app
    environment: *backend-env
    depends_on:
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # Comparte la red del backend para que `localhost:8000` (NEXT_PUBLIC_API_URL)
    # funcione también desde el servidor de Next.js (login, signup, sitemap...),
    # no solo desde el navegador.
    network_mode: "service:backend"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    env_file:
      - path: ./frontend/.env.local
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next_cache:
